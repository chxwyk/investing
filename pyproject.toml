[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-money-copy-bot"
version = "2.43.0"
description = "Discord bot for automatically discovering and paper-copying public Solana wallets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11,<4",
  "aiosqlite>=0.21,<1",
  "discord.py>=2.5,<3",
  "pillow>=11,<13",
  "solders>=0.26,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
smart-money-bot = "smart_money_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
